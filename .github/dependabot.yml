# Dependency update policy for this repository.
#
# Three ecosystems (cargo, github-actions, docker) across four manifests. Each
# block runs weekly and is grouped into a single pull request, so a routine
# update week produces a handful of reviewable PRs rather than dozens. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust crates declared in Cargo.toml / Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"

  # Actions referenced by the workflows in .github/workflows/.
  # Dependabot rewrites the pinned SHA and refreshes the trailing version
  # comment, so pinning does not freeze these at a stale release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the root Dockerfile (alpine, distroless).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"

  # Base images in the Home Assistant add-on Dockerfile.
  - package-ecosystem: "docker"
    directory: "/addon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      addon-docker:
        patterns:
          - "*"
