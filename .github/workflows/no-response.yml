name: No Response

# Both `issue_comment` and `scheduled` event types are required for this Action
# to work properly.
on:
  issue_comment:
    types: [created]
  schedule:
    # Schedule for five minutes after midnight
    - cron: '5 0 * * *'

# Least privilege by default; jobs opt into the extra scopes they need.
permissions:
  contents: read

jobs:
  noResponse:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: lee-dohm/no-response@9bb0a4b5e6a45046f00353d5de7d90fb8bd773bb # v0.5.0
        with:
          token: ${{ github.token }}
          responseRequiredLabel: waiting-on-op

